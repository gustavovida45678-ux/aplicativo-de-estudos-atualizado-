        // ============ DOCUMENT VIEWER ============
        let documents = [];
        let pdfDoc = null;
        let currentPdfPage = 1;
        let currentPdfScale = 1.5;
        let currentDocument = null;

        function initDocumentViewer() {
            const uploadArea = document.getElementById('documentUploadArea');
            const fileInput = document.getElementById('documentFileInput');
            const tabs = document.querySelectorAll('.sidebar-tab');
            const tabContents = document.querySelectorAll('.tab-content');
            const viewerModal = document.getElementById('documentViewerModal');
            const viewerCloseBtn = document.getElementById('viewerCloseBtn');
            const viewerDownloadBtn = document.getElementById('viewerDownloadBtn');
            const pdfPrevBtn = document.getElementById('pdfPrevBtn');
            const pdfNextBtn = document.getElementById('pdfNextBtn');

            // Tab switching
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
                });
            });

            // Drag and drop
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('drag-over');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('drag-over');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('drag-over');
                handleFiles(e.dataTransfer.files);
            });

            uploadArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

            // Viewer close
            viewerCloseBtn.addEventListener('click', closeDocumentViewer);
            viewerModal.addEventListener('click', (e) => {
                if (e.target === viewerModal) closeDocumentViewer();
            });

            // Download
            viewerDownloadBtn.addEventListener('click', downloadCurrentDocument);
            viewerImportBtn.addEventListener('click', importDocumentToWhiteboard);

            // PDF navigation
            pdfPrevBtn.addEventListener('click', () => {
                if (currentPdfPage > 1) {
                    currentPdfPage--;
                    renderPdfPage();
                }
            });

            pdfNextBtn.addEventListener('click', () => {
                if (pdfDoc && currentPdfPage < pdfDoc.numPages) {
                    currentPdfPage++;
                    renderPdfPage();
                }
            });

            // Keyboard navigation for PDF
            document.addEventListener('keydown', (e) => {
                if (!viewerModal.classList.contains('open')) return;
                if (e.key === 'Escape') closeDocumentViewer();
                if (e.key === 'ArrowLeft' && pdfDoc) {
                    e.preventDefault();
                    if (currentPdfPage > 1) { currentPdfPage--; renderPdfPage(); }
                }
                if (e.key === 'ArrowRight' && pdfDoc) {
                    e.preventDefault();
                    if (currentPdfPage < pdfDoc.numPages) { currentPdfPage++; renderPdfPage(); }
                }
            });

            // Load saved documents from localStorage
            loadDocuments();
        }

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (isValidFileType(file)) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const document = {
                            id: Date.now() + Math.random(),
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            data: e.target.result,
                            addedAt: new Date().toISOString()
                        };
                        documents.push(document);
                        saveDocuments();
                        renderDocumentList();
                        showToast(`Documento "${file.name}" adicionado!`, 'success');
                    };
                    reader.readAsDataURL(file);
                } else {
                    showToast(`Tipo de arquivo não suportado: ${file.name}`, 'error');
                }
            });
        }

        function isValidFileType(file) {
            const validTypes = ['application/pdf', 'image/png', 'image/jpeg', 'image/webp'];
            return validTypes.includes(file.type);
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function getFileIcon(type) {
            if (type === 'application/pdf') {
                return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`;
            }
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
        }

        function renderDocumentList() {
            const list = document.getElementById('documentList');
            if (documents.length === 0) {
                list.innerHTML = '<div class="empty-documents">Nenhum documento adicionado</div>';
                return;
            }

            list.innerHTML = documents.map(doc => `
                <div class="document-item" data-id="${doc.id}">
                    <div class="document-icon ${doc.type === 'application/pdf' ? 'pdf' : 'image'}">
                        ${getFileIcon(doc.type)}
                    </div>
                    <div class="document-info">
                        <div class="document-name" title="${doc.name}">${doc.name}</div>
                        <div class="document-meta">${formatFileSize(doc.size)} • ${new Date(doc.addedAt).toLocaleDateString('pt-BR')}</div>
                    </div>
                    <div class="document-actions">
                        <button class="document-action-btn view-btn" title="Visualizar" data-id="${doc.id}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                        <button class="document-action-btn delete-btn" title="Excluir" data-id="${doc.id}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');

            // Add event listeners
            list.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDocumentViewer(btn.dataset.id);
                });
            });

            list.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteDocument(btn.dataset.id);
                });
            });

            list.querySelectorAll('.document-item').forEach(item => {
                item.addEventListener('click', () => {
                    openDocumentViewer(item.dataset.id);
                });
            });
        }

        function saveDocuments() {
            const docsToSave = documents.map(doc => ({
                id: doc.id,
                name: doc.name,
                type: doc.type,
                size: doc.size,
                data: doc.data,
                addedAt: doc.addedAt
            }));
            localStorage.setItem('lousa-documents', JSON.stringify(docsToSave));
        }

        function loadDocuments() {
            const saved = localStorage.getItem('lousa-documents');
            if (saved) {
                try {
                    documents = JSON.parse(saved);
                    renderDocumentList();
                } catch (e) {
                    console.error('Erro ao carregar documentos:', e);
                    documents = [];
                }
            }
        }

        function deleteDocument(id) {
            if (confirm('Tem certeza que deseja excluir este documento?')) {
                documents = documents.filter(doc => doc.id != id);
                saveDocuments();
                renderDocumentList();
                showToast('Documento excluído', 'info');
            }
        }

        function openDocumentViewer(id) {
            const doc = documents.find(d => d.id == id);
            if (!doc) return;

            currentDocument = doc;
            const modal = document.getElementById('documentViewerModal');
            const title = document.getElementById('viewerTitle');
            const content = document.getElementById('viewerContent');
            const pdfNav = document.getElementById('pdfNav');

            title.textContent = doc.name;
            content.innerHTML = '';

            if (doc.type === 'application/pdf') {
                pdfNav.style.display = 'flex';
                loadPdf(doc.data);
            } else {
                pdfNav.style.display = 'none';
                const img = document.createElement('img');
                img.src = doc.data;
                img.alt = doc.name;
                content.appendChild(img);
            }

            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeDocumentViewer() {
            const modal = document.getElementById('documentViewerModal');
            modal.classList.remove('open');
            document.body.style.overflow = '';
            pdfDoc = null;
            currentPdfPage = 1;
            currentDocument = null;
        }

        function importDocumentToWhiteboard() {
            if (!currentDocument) return;

            const centerX = canvas.width / 2 / (window.devicePixelRatio || 1);
            const centerY = canvas.height / 2 / (window.devicePixelRatio || 1);

            if (currentDocument.type === 'application/pdf') {
                // Para PDF, renderizar a página atual em um canvas e adicionar como imagem
                if (!pdfDoc) return;
                
                pdfDoc.getPage(currentPdfPage).then(page => {
                    const viewport = page.getViewport({ scale: 2 });
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCanvas.width = viewport.width;
                    tempCanvas.height = viewport.height;
                    
                    page.render({ canvasContext: tempCtx, viewport }).promise.then(() => {
                        const dataUrl = tempCanvas.toDataURL('image/png');
                        addImageElement(dataUrl, centerX - viewport.width / 4, centerY - viewport.height / 4, viewport.width / 2, viewport.height / 2);
                        closeDocumentViewer();
                        showToast('PDF importado para o quadro!', 'success');
                    });
                });
            } else {
                // Para imagens, adicionar diretamente
                addImageElement(currentDocument.data, centerX - 150, centerY - 100, 300, 200);
                closeDocumentViewer();
                showToast('Imagem importada para o quadro!', 'success');
            }
        }

        function addImageElement(dataUrl, x, y, width, height) {
            const img = new Image();
            img.onload = () => {
                const imageElement = {
                    id: elementIdCounter++,
                    type: 'image',
                    dataUrl: dataUrl,
                    x: x,
                    y: y,
                    width: width,
                    height: height,
                    opacity: 1
                };
                elements.push(imageElement);
                saveState();
                redrawCanvas();
            };
            img.src = dataUrl;
        }

        function downloadCurrentDocument() {
            if (!currentDocument) return;
            const link = document.createElement('a');
            link.download = currentDocument.name;
            link.href = currentDocument.data;
            link.click();
            showToast('Download iniciado', 'success');
        }

        async function loadPdf(dataUrl) {
            const content = document.getElementById('viewerContent');
            content.innerHTML = `
                <div class="pdf-loading">
                    <div class="spinner"></div>
                    <span>Carregando PDF...</span>
                </div>
            `;

            try {
                // Load PDF.js dynamically
                if (typeof pdfjsLib === 'undefined') {
                    await loadPdfJs();
                }

                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                
                pdfDoc = await pdfjsLib.getDocument(dataUrl).promise;
                currentPdfPage = 1;
                renderPdfPage();
            } catch (error) {
                console.error('Erro ao carregar PDF:', error);
                content.innerHTML = `
                    <div class="pdf-loading" style="color: #ef4444;">
                        <span>Erro ao carregar PDF</span>
                    </div>
                `;
            }
        }

        function loadPdfJs() {
            return new Promise((resolve, reject) => {
                if (typeof pdfjsLib !== 'undefined') {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('Falha ao carregar PDF.js'));
                document.head.appendChild(script);
            });
        }

        async function renderPdfPage() {
            if (!pdfDoc) return;

            const content = document.getElementById('viewerContent');
            const pageInfo = document.getElementById('pdfPageInfo');
            const prevBtn = document.getElementById('pdfPrevBtn');
            const nextBtn = document.getElementById('pdfNextBtn');

            prevBtn.disabled = currentPdfPage <= 1;
            nextBtn.disabled = currentPdfPage >= pdfDoc.numPages;
            pageInfo.textContent = `Página ${currentPdfPage} de ${pdfDoc.numPages}`;

            const page = await pdfDoc.getPage(currentPdfPage);
            const viewport = page.getViewport({ scale: currentPdfScale });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.className = 'pdf-page';

            content.innerHTML = '';
            content.appendChild(canvas);

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            await page.render(renderContext).promise;
        }

        // Iniciar
        init();
        initDocumentViewer();
    </script>
</body>
</html>
