<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lousa Digital - Quadro Virtual com Reconhecimento de Gestos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00d9ff, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-bar {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 0.85rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            transition: background 0.3s;
        }

        .status-dot.active {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .main-container {
            flex: 1;
            display: flex;
            position: relative;
        }

        .sidebar {
            width: 280px;
            background: #16213e;
            border-right: 2px solid #0f3460;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tool-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            font-weight: 600;
        }

        .tool-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tool-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }

        .tool-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .tool-btn.active {
            background: #0f3460;
            box-shadow: 0 0 12px rgba(0, 217, 255, 0.5);
            border: 2px solid #00d9ff;
        }

        .tool-btn svg {
            width: 24px;
            height: 24px;
            stroke: #eee;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .color-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid transparent;
        }

        .color-btn:hover {
            transform: scale(1.15);
        }

        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        .size-slider {
            width: 100%;
            accent-color: #00d9ff;
        }

        .size-value {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #00d9ff;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #0f3460;
        }

        .action-btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #00d9ff, #10b981);
            color: #1a1a2e;
        }

        .action-btn.primary:hover {
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
        }

        .action-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #eee;
        }

        .action-btn.secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .action-btn.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }

        .sidebar-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 8px;
        }

        .sidebar-tab {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-tab:hover {
            background: rgba(255,255,255,0.08);
            color: #eee;
        }

        .sidebar-tab.active {
            background: #0f3460;
            color: #00d9ff;
            box-shadow: 0 0 12px rgba(0, 217, 255, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .document-upload-area {
            border: 2px dashed #0f3460;
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.02);
        }

        .document-upload-area:hover,
        .document-upload-area.drag-over {
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.08);
        }

        .document-upload-area p {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .upload-hint {
            display: block;
            margin-top: 6px;
            font-size: 0.7rem;
            color: #666;
        }

        .document-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .document-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            border: 1px solid #0f3460;
            cursor: pointer;
            transition: all 0.2s;
        }

        .document-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: #00d9ff;
        }

        .document-icon {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .document-icon.pdf { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .document-icon.image { background: linear-gradient(135deg, #10b981, #059669); }

        .document-icon svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
        }

        .document-info {
            flex: 1;
            min-width: 0;
        }

        .document-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-meta {
            font-size: 0.65rem;
            color: #888;
            margin-top: 2px;
        }

        .document-actions {
            display: flex;
            gap: 6px;
        }

        .document-action-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .document-action-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #eee;
        }

        .document-action-btn.delete:hover {
            background: #ef4444;
            color: #fff;
        }

        .document-action-btn svg {
            width: 16px;
            height: 16px;
        }

        .empty-documents {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.8rem;
        }

        .document-viewer-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .document-viewer-modal.open {
            display: flex;
        }

        .document-viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }

        .document-viewer-title {
            font-size: 1rem;
            font-weight: 600;
            color: #eee;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-viewer-controls {
            display: flex;
            gap: 8px;
        }

        .viewer-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .viewer-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .viewer-btn svg {
            width: 20px;
            height: 20px;
        }

        .document-viewer-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 20px;
        }

        .document-viewer-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .document-viewer-content canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .pdf-page {
            margin: 10px auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: #fff;
        }

        .pdf-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: #888;
        }

        .pdf-loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #0f3460;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .pdf-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: #16213e;
            border-top: 1px solid #0f3460;
        }

        .pdf-nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #00d9ff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pdf-nav-btn:hover:not(:disabled) {
            background: #00d9ff;
            color: #1a1a2e;
        }

        .pdf-nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pdf-page-info {
            display: flex;
            align-items: center;
            color: #aaa;
            font-size: 0.9rem;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: #0a0a1a;
            overflow: hidden;
        }

        .canvas-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 200px 50px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 250px 150px, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 300px 90px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 350px 200px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 400px 60px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 450px 180px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 500px 100px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 550px 220px, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 600px 140px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 650px 250px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 700px 80px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 750px 280px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 800px 120px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 850px 300px, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 900px 160px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 950px 320px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 1000px 100px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 1050px 350px, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 1100px 180px, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 1150px 380px, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 1200px 220px, rgba(255,255,255,0.8), transparent);
            background-repeat: repeat;
            background-size: 1200px 400px;
            animation: starTwinkle 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        @keyframes starTwinkle {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.02); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        #whiteboard {
            display: block;
            cursor: crosshair;
            touch-action: none;
            background: rgba(10, 10, 26, 0.95);
            position: relative;
            z-index: 1;
        }

        #video {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            border: 2px solid #0f3460;
            transform: rotateY(180deg);
            opacity: 0.8;
            pointer-events: none;
            z-index: 50;
            background: #0f172a;
        }

        #video.hidden {
            display: none;
        }

        .hand-indicator {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00d9ff;
            pointer-events: none;
            z-index: 40;
            box-shadow: 0 0 10px #00d9ff, 0 0 20px #00d9ff;
            animation: pulse 1.5s infinite;
            transform: translate(-50%, -50%);
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        .text-input-overlay {
            position: absolute;
            background: #16213e;
            border: 2px solid #00d9ff;
            border-radius: 8px;
            padding: 10px;
            z-index: 100;
            min-width: 200px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .text-input-overlay input,
        .text-input-overlay textarea {
            width: 100%;
            background: #0d0d1a;
            border: 1px solid #0f3460;
            border-radius: 4px;
            padding: 8px;
            color: #eee;
            font-size: 14px;
            outline: none;
        }

        .text-input-overlay input:focus,
        .text-input-overlay textarea:focus {
            border-color: #00d9ff;
        }

        .text-input-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .text-input-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .text-input-actions .confirm {
            background: #10b981;
            color: #1a1a2e;
        }

        .text-input-actions .cancel {
            background: #ef4444;
            color: #fff;
        }

        .gesture-guide {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 16px;
            font-size: 0.75rem;
            max-width: 250px;
            z-index: 30;
        }

        .gesture-guide h4 {
            color: #00d9ff;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .gesture-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .gesture-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .gesture-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 6px;
        }

        .gesture-icon svg {
            width: 20px;
            height: 20px;
            stroke: #00d9ff;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            border-radius: 8px;
            background: #16213e;
            border: 1px solid #0f3460;
            color: #eee;
            font-weight: 500;
            z-index: 200;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #ef4444; }
        .toast.info { border-color: #00d9ff; }

        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 200px;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-start;
                border-right: none;
                border-bottom: 2px solid #0f3460;
            }
            .tool-group {
                flex: 1;
                min-width: 150px;
            }
            .action-buttons {
                flex-direction: row;
                margin-top: 0;
                padding-top: 0;
                border-top: none;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>🖐️ Lousa Digital</h1>
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="cameraStatus"></div>
                <span id="cameraStatusText">Câmera: Desconectada</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="handStatus"></div>
                <span id="handStatusText">Mão: Não detectada</span>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" data-tab="tools">Ferramentas</button>
                <button class="sidebar-tab" data-tab="documents">Documentos</button>
            </div>
            <div class="tab-content active" id="toolsTab">
                <div class="tool-group">
                    <label>Ferramentas</label>
                    <div class="tool-buttons">
                    <button class="tool-btn active" data-tool="pen" title="Caneta (Dedo indicador)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                            <path d="M2 2l7.586 7.586"/>
                            <circle cx="11" cy="11" r="2"/>
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="eraser" title="Borracha (Punho fechado)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 20H7L2 15l9-9 9 9-5 5z"/>
                            <path d="M14 10l-4 4"/>
                            <path d="M10 10l4 4"/>
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="text" title="Texto (Clique no quadro)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="4 7 4 4 20 4 20 7"/>
                            <line x1="9" y1="20" x2="15" y2="20"/>
                            <line x1="12" y1="4" x2="12" y2="20"/>
                        </svg>
                    </button>
                    <button class="tool-btn" data-tool="select" title="Selecionar/Mover">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                            <path d="M13 13l6 6"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="tool-group">
                <label>Cores</label>
                <div class="color-palette" id="colorPalette"></div>
            </div>

            <div class="tool-group">
                <label>Tamanho: <span class="size-value" id="sizeValue">3</span>px</label>
                <input type="range" class="size-slider" id="sizeSlider" min="1" max="50" value="3">
            </div>

            <div class="tool-group">
                <label>Opacidade: <span class="size-value" id="opacityValue">100</span>%</label>
                <input type="range" class="size-slider" id="opacitySlider" min="10" max="100" value="100">
            </div>

            </div>
            </div>
            <div class="tab-content" id="documentsTab">
                <div class="tool-group">
                    <label>Documentos</label>

    <script type="module">
        import { Hands } from 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';
        import { Camera } from 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640086154/camera_utils.js';
        import { drawConnectors, drawLandmarks } from 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1640086154/drawing_utils.js';
        import { HAND_CONNECTIONS } from 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js';

        // ============ CONFIGURAÇÕES ============
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const handIndicator = document.getElementById('handIndicator');

        // Estado da aplicação
        let currentTool = 'pen';
        let currentColor = '#00d9ff';
        let currentSize = 3;
        let currentOpacity = 1.0;
        let isDrawing = false;
        let lastPoint = null;
        let history = [];
        let historyIndex = -1;
        let cameraActive = false;
        let hands = null;
        let camera = null;
        let lastHandLandmarks = null;
        let gestureState = 'none';
        let pinchThreshold = 0.05;
        let fistThreshold = 0.08;

        // Elementos do quadro (traços e textos)
        let elements = [];
        let currentStroke = null;
        let selectedElement = null;
        let elementIdCounter = 0;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let isResizing = false;
        let resizeHandle = null;
        let textEditOverlay = null;

        // Cores disponíveis
        const colors = [
            '#00d9ff', '#10b981', '#f59e0b', '#ef4444',
            '#ffffff', '#000000', '#8b5cf6', '#ec4899',
            '#06b6d4', '#84cc16', '#f97316', '#6366f1'
        ];

        // ============ INICIALIZAÇÃO ============
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupColorPalette();
            setupEventListeners();
            initCamera();
            loadWhiteboardState();
            saveState();
            showToast('Lousa Digital carregada! Permita acesso à câmera.', 'info');
        }

        function resizeCanvas() {
            const container = document.querySelector('.canvas-container');
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            // Preencher com a cor de fundo do quadro (semi-transparente para ver estrelas)
            ctx.fillStyle = 'rgba(10, 10, 26, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            redrawCanvas();
        }

        function setupColorPalette() {
            const palette = document.getElementById('colorPalette');
            colors.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'color-btn' + (color === currentColor ? ' active' : '');
                btn.style.background = color;
                btn.dataset.color = color;
                btn.addEventListener('click', () => selectColor(color));
                palette.appendChild(btn);
            });
        }

        function setupEventListeners() {
            // Ferramentas
            document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
                btn.addEventListener('click', () => selectTool(btn.dataset.tool));
            });

            // Sliders
            document.getElementById('sizeSlider').addEventListener('input', (e) => {
                currentSize = parseInt(e.target.value);
                document.getElementById('sizeValue').textContent = currentSize;
            });

            document.getElementById('opacitySlider').addEventListener('input', (e) => {
                currentOpacity = parseInt(e.target.value) / 100;
                document.getElementById('opacityValue').textContent = Math.round(currentOpacity * 100);
            });

            // Ações
            document.getElementById('clearBtn').addEventListener('click', clearCanvas);
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);
            document.getElementById('saveBtn').addEventListener('click', saveImage);
            document.getElementById('toggleCameraBtn').addEventListener('click', toggleCamera);

            // Canvas - mouse/touch para ferramenta de texto e seleção
            canvas.addEventListener('mousedown', handleCanvasMouseDown);
            canvas.addEventListener('mousemove', handleCanvasMouseMove);
            canvas.addEventListener('mouseup', handleCanvasMouseUp);
            canvas.addEventListener('mouseleave', handleCanvasMouseUp);

            canvas.addEventListener('touchstart', handleCanvasTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleCanvasTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleCanvasTouchEnd);

            // Teclado
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) {
                        redo();
                    } else {
                        undo();
                    }
                }
                if (e.ctrlKey && e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
                if (e.key === 'Escape') {
                    closeTextInput();
                    closeTextEditOverlay();
                }
            });
        }

        // ============ CÂMERA E MEDIAPIPE ============
        async function initCamera() {
            try {
                updateCameraStatus('connecting', 'Conectando...');

                hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.7
                });

                hands.onResults(onHandResults);

                camera = new Camera(video, {
                    onFrame: async () => {
                        if (cameraActive) {
                            await hands.send({ image: video });
                        }
                    },
                    width: 640,
                    height: 480
                });

                // Revelar o vídeo SOMENTE após o primeiro frame real, evitando
                // telas azuis/purple placeholder de backends de câmera.
                const revealVideo = () => {
                    video.classList.remove('hidden');
                    video.removeEventListener('loadeddata', revealVideo);
                };
                video.addEventListener('loadeddata', revealVideo);

                await camera.start();
                cameraActive = true;
                updateCameraStatus('active', 'Câmera: Conectada');
                updateToggleButton(true);
                showToast('Câmera iniciada! Mostre sua mão para a câmera.', 'success');
            } catch (error) {
                console.error('Erro ao iniciar câmera:', error);
                video.classList.add('hidden');
                cameraActive = false;
                updateCameraStatus('error', 'Câmera: Erro');
                updateToggleButton(false);
                showToast('Erro ao acessar câmera. Verifique permissões.', 'error');
            }
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                lastHandLandmarks = landmarks;
                updateHandStatus('detected', 'Mão: Detectada');

                // Detectar gesto
                const gesture = detectGesture(landmarks);
                handleGesture(gesture, landmarks);

                // Atualizar indicador visual na ponta do indicador
                const indexTip = landmarks[8];
                updateHandIndicator(indexTip);
            } else {
                // Se estava desenhando com a mão, salvar o estado para o "Desfazer"
                if (isDrawing && currentStroke) {
                    elements.push(currentStroke);
                    currentStroke = null;
                    saveState();
                }
                isDrawing = false;
                lastPoint = null;
                lastHandLandmarks = null;
                updateHandStatus('none', 'Mão: Não detectada');
                handIndicator.style.display = 'none';
                gestureState = 'none';
            }
        }

        function detectGesture(landmarks) {
            // Pontos chave
            const wrist = landmarks[0];
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const indexPip = landmarks[6];
            const middleTip = landmarks[12];
            const middlePip = landmarks[10];
            const ringTip = landmarks[16];
            const ringPip = landmarks[14];
            const pinkyTip = landmarks[20];
            const pinkyPip = landmarks[18];

            // Verificar se dedos estão estendidos (ponta mais alta que a junta proximal no eixo Y)
            const indexExtended = indexTip.y < indexPip.y;
            const middleExtended = middleTip.y < middlePip.y;
            const ringExtended = ringTip.y < ringPip.y;
            const pinkyExtended = pinkyTip.y < pinkyPip.y;

            const extendedCount = [indexExtended, middleExtended, ringExtended, pinkyExtended].filter(Boolean).length;

            // Distância entre polegar e indicador (pinça)
            const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

            // Apontando: só indicador estendido (verificar ANTES do punho fechado,
            // pois extendedCount === 1 também atenderia ao "fist")
            if (indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
                return 'point';
            }

            // Punho fechado: poucos dedos estendidos (agora com "point" já descartado)
            if (extendedCount <= 1) {
                return 'fist';
            }

            // Pinça: polegar e indicador próximos
            if (pinchDist < pinchThreshold && indexExtended && !middleExtended) {
                return 'pinch';
            }

            // Mão aberta: todos estendidos
            if (extendedCount >= 3) {
                return 'open';
            }

            return 'none';
        }

        function handleGesture(gesture, landmarks) {
            const indexTip = landmarks[8];
            const canvasRect = canvas.getBoundingClientRect();
            // O vídeo é exibido espelhado (rotateY(180deg)), então espelhamos o eixo X
            // para o traço e o indicador ficarem alinhados com a mão mostrada na pré-visualização.
            const x = (1 - indexTip.x) * canvasRect.width;
            const y = indexTip.y * canvasRect.height;

            switch (gesture) {
                case 'point':
                case 'pinch':
                    if (currentTool === 'pen' || currentTool === 'eraser') {
                        if (!isDrawing) {
                            isDrawing = true;
                            lastPoint = { x, y };
                            currentStroke = null;
                        } else if (lastPoint) {
                            if (currentTool === 'pen') {
                                drawLine(lastPoint.x, lastPoint.y, x, y);
                            } else {
                                eraseArea(lastPoint.x, lastPoint.y, x, y);
                            }
                            lastPoint = { x, y };
                        }
                    }
                    break;

                case 'fist':
                    if (currentTool !== 'eraser') {
                        selectTool('eraser');
                    }
                    if (!isDrawing) {
                        isDrawing = true;
                        lastPoint = { x, y };
                        currentStroke = null;
                    } else if (lastPoint) {
                        eraseArea(lastPoint.x, lastPoint.y, x, y);
                        lastPoint = { x, y };
                    }
                    break;

                case 'open':
                    // Mão aberta - poderia ser usado para pan/zoom no futuro
                    if (isDrawing && currentStroke) {
                        elements.push(currentStroke);
                        currentStroke = null;
                        saveState();
                    }
                    isDrawing = false;
                    lastPoint = null;
                    break;

                default:
                    if (isDrawing && currentStroke) {
                        elements.push(currentStroke);
                        currentStroke = null;
                        saveState();
                    }
                    isDrawing = false;
                    lastPoint = null;
            }

            gestureState = gesture;
        }

        function updateHandIndicator(landmark) {
            const canvasRect = canvas.getBoundingClientRect();
            // Espelhar X para coincidir com a pré-visualização espelhada do vídeo
            handIndicator.style.left = ((1 - landmark.x) * canvasRect.width) + 'px';
            handIndicator.style.top = (landmark.y * canvasRect.height) + 'px';
            handIndicator.style.display = 'block';

            // Mudar cor baseado no gesto
            switch (gestureState) {
                case 'point':
                case 'pinch':
                    handIndicator.style.background = currentTool === 'eraser' ? '#ef4444' : currentColor;
                    break;
                case 'fist':
                    handIndicator.style.background = '#ef4444';
                    break;
                case 'open':
                    handIndicator.style.background = '#f59e0b';
                    break;
            }
        }

        // ============ DESENHO NO CANVAS ============
        function drawLine(x1, y1, x2, y2) {
            if (!currentStroke) {
                currentStroke = {
                    id: elementIdCounter++,
                    type: 'stroke',
                    color: currentColor,
                    opacity: currentOpacity,
                    size: currentTool === 'eraser' ? currentSize * 4 : currentSize,
                    points: [{ x: x1, y: y1 }],
                    isEraser: currentTool === 'eraser'
                };
            }
            currentStroke.points.push({ x: x2, y: y2 });

            // Visual feedback during drawing
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
                ctx.lineWidth = currentStroke.size;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = hexToRgba(currentColor, currentOpacity);
                ctx.lineWidth = currentStroke.size;
            }
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function eraseArea(x1, y1, x2, y2) {
            // For eraser, we create a stroke with destination-out composite
            if (!currentStroke) {
                currentStroke = {
                    id: elementIdCounter++,
                    type: 'stroke',
                    color: '#000000',
                    opacity: 1,
                    size: currentSize * 4,
                    points: [{ x: x1, y: y1 }],
                    isEraser: true
                };
            }
            currentStroke.points.push({ x: x2, y: y2 });

            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = currentStroke.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.globalCompositeOperation = 'source-over';
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // ============ EVENTOS DE MOUSE/TOUCH (PARA TEXTO, DESENHO E SELEÇÃO) ============
        function getCanvasPos(e, touch = null) {
            const rect = canvas.getBoundingClientRect();
            if (touch !== null) {
                return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startDrawing(x, y) {
            isDrawing = true;
            lastPoint = { x, y };
            currentStroke = null;
        }

        function stopDrawing() {
            if (isDrawing && currentStroke) {
                elements.push(currentStroke);
                currentStroke = null;
                saveState();
            }
            isDrawing = false;
            lastPoint = null;
        }

        function handleCanvasMouseDown(e) {
            const pos = getCanvasPos(e);

            if (currentTool === 'select') {
                handleSelectMouseDown(pos.x, pos.y);
                return;
            }

            if (currentTool === 'text') {
                showTextInput(pos.x, pos.y);
                return;
            }

            if (currentTool === 'pen' || currentTool === 'eraser') {
                startDrawing(pos.x, pos.y);
            }
        }

        function handleCanvasMouseMove(e) {
            const pos = getCanvasPos(e);

            if (currentTool === 'select') {
                handleSelectMouseMove(pos.x, pos.y);
                return;
            }

            if (isDrawing && (currentTool === 'pen' || currentTool === 'eraser') && lastPoint) {
                if (currentTool === 'pen') {
                    drawLine(lastPoint.x, lastPoint.y, pos.x, pos.y);
                } else {
                    eraseArea(lastPoint.x, lastPoint.y, pos.x, pos.y);
                }
                lastPoint = { x: pos.x, y: pos.y };
            }
        }

        function handleCanvasMouseUp(e) {
            if (currentTool === 'select') {
                handleSelectMouseUp();
                return;
            }

            if (isDrawing && (currentTool === 'pen' || currentTool === 'eraser')) {
                stopDrawing();
            }
        }

        function handleCanvasTouchStart(e) {
            e.preventDefault();
            if (e.touches.length !== 1) return;
            const pos = getCanvasPos(e, e.touches[0]);

            if (currentTool === 'select') {
                handleSelectMouseDown(pos.x, pos.y);
                return;
            }

            if (currentTool === 'text') {
                showTextInput(pos.x, pos.y);
            } else if (currentTool === 'pen' || currentTool === 'eraser') {
                startDrawing(pos.x, pos.y);
            }
        }

        function handleCanvasTouchMove(e) {
            e.preventDefault();
            if (e.touches.length !== 1) return;
            const pos = getCanvasPos(e, e.touches[0]);

            if (currentTool === 'select') {
                handleSelectMouseMove(pos.x, pos.y);
                return;
            }

            if (isDrawing && (currentTool === 'pen' || currentTool === 'eraser') && lastPoint) {
                if (currentTool === 'pen') {
                    drawLine(lastPoint.x, lastPoint.y, pos.x, pos.y);
                } else {
                    eraseArea(lastPoint.x, lastPoint.y, pos.x, pos.y);
                }
                lastPoint = { x: pos.x, y: pos.y };
            }
        }

        function handleCanvasTouchEnd(e) {
            e.preventDefault();
            if (currentTool === 'select') {
                handleSelectMouseUp();
                return;
            }

            if (isDrawing && (currentTool === 'pen' || currentTool === 'eraser')) {
                stopDrawing();
            }
        }

        // ============ SELECT TOOL HANDLERS ============
        function handleSelectMouseDown(x, y) {
            // Check if clicking on a resize handle
            if (selectedElement) {
                const handle = getHandleAtPosition(selectedElement, x, y);
                if (handle) {
                    isResizing = true;
                    resizeHandle = handle;
                    return;
                }
            }

            // Check if clicking on an element
            let foundElement = null;
            for (let i = elements.length - 1; i >= 0; i--) {
                if (isPointInElement(elements[i], x, y)) {
                    foundElement = elements[i];
                    break;
                }
            }

            if (foundElement) {
                selectedElement = foundElement;
                isDragging = true;
                dragOffset = { x: x - foundElement.x, y: y - foundElement.y };
                redrawCanvas();
            } else {
                selectedElement = null;
                redrawCanvas();
            }
        }

        function handleSelectMouseMove(x, y) {
            if (isResizing && selectedElement) {
                handleResize(x, y);
                redrawCanvas();
                return;
            }

            if (isDragging && selectedElement) {
                selectedElement.x = x - dragOffset.x;
                selectedElement.y = y - dragOffset.y;
                redrawCanvas();
            }
        }

        function handleSelectMouseUp() {
            if (isDragging || isResizing) {
                saveState();
            }
            isDragging = false;
            isResizing = false;
            resizeHandle = null;
        }

        function handleResize(x, y) {
            if (!selectedElement || (selectedElement.type !== 'text' && selectedElement.type !== 'image')) return;

            const el = selectedElement;

            if (el.type === 'text') {
                const minFontSize = 12;
                const maxFontSize = 200;

                switch (resizeHandle) {
                    case 'se':
                        const newWidth = Math.max(50, x - el.x);
                        const scale = newWidth / el.width;
                        el.fontSize = Math.min(maxFontSize, Math.max(minFontSize, el.fontSize * scale));
                        break;
                    case 'ne':
                        const newWidth2 = Math.max(50, x - el.x);
                        const scale2 = newWidth2 / el.width;
                        el.fontSize = Math.min(maxFontSize, Math.max(minFontSize, el.fontSize * scale2));
                        break;
                    case 'sw':
                        const newWidth3 = Math.max(50, el.x + el.width - x);
                        const scale3 = newWidth3 / el.width;
                        el.fontSize = Math.min(maxFontSize, Math.max(minFontSize, el.fontSize * scale3));
                        el.x = x;
                        break;
                    case 'nw':
                        const newWidth4 = Math.max(50, el.x + el.width - x);
                        const scale4 = newWidth4 / el.width;
                        el.fontSize = Math.min(maxFontSize, Math.max(minFontSize, el.fontSize * scale4));
                        el.x = x;
                        break;
                }

                ctx.save();
                ctx.font = `${el.fontSize}px 'Segoe UI', sans-serif`;
                const metrics = ctx.measureText(el.text);
                el.width = metrics.width;
                el.height = el.fontSize * 1.2;
                ctx.restore();
            } else if (el.type === 'image') {
                const minSize = 20;
                switch (resizeHandle) {
                    case 'se':
                        el.width = Math.max(minSize, x - el.x);
                        el.height = Math.max(minSize, y - el.y);
                        break;
                    case 'ne':
                        el.width = Math.max(minSize, x - el.x);
                        el.height = Math.max(minSize, el.y + el.height - y);
                        el.y = y;
                        break;
                    case 'sw':
                        el.width = Math.max(minSize, el.x + el.width - x);
                        el.height = Math.max(minSize, y - el.y);
                        el.x = x;
                        break;
                    case 'nw':
                        el.width = Math.max(minSize, el.x + el.width - x);
                        el.height = Math.max(minSize, el.y + el.height - y);
                        el.x = x;
                        el.y = y;
                        break;
                }
            }
        }

        // Double-click to edit text
        canvas.addEventListener('dblclick', (e) => {
            if (currentTool !== 'select') return;
            const pos = getCanvasPos(e);
            
            for (let i = elements.length - 1; i >= 0; i--) {
                if (elements[i].type === 'text' && isPointInElement(elements[i], pos.x, pos.y)) {
                    selectedElement = elements[i];
                    showTextEditOverlay(selectedElement);
                    redrawCanvas();
                    return;
                }
            }
        });

        // ============ FERRAMENTA DE TEXTO ============
        let textInputOverlay = null;

        function showTextInput(x, y) {
            closeTextInput();

            // Check if clicking on existing text element (for editing)
            if (currentTool === 'text') {
                for (let i = elements.length - 1; i >= 0; i--) {
                    if (elements[i].type === 'text' && isPointInElement(elements[i], x, y)) {
                        showTextEditOverlay(elements[i]);
                        return;
                    }
                }
            }

            textInputOverlay = document.createElement('div');
            textInputOverlay.className = 'text-input-overlay';
            textInputOverlay.style.left = (x + 10) + 'px';
            textInputOverlay.style.top = (y + 10) + 'px';

            textInputOverlay.innerHTML = `
                <input type="text" id="textInputField" placeholder="Digite seu texto..." spellcheck="false">
                <div class="text-input-actions">
                    <button class="confirm" id="confirmText">Adicionar</button>
                    <button class="cancel" id="cancelText">Cancelar</button>
                </div>
            `;

            document.querySelector('.canvas-container').appendChild(textInputOverlay);

            const input = document.getElementById('textInputField');
            input.focus();

            document.getElementById('confirmText').addEventListener('click', () => addText(x, y, input.value));
            document.getElementById('cancelText').addEventListener('click', closeTextInput);

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    addText(x, y, input.value);
                } else if (e.key === 'Escape') {
                    closeTextInput();
                }
            });
        }

        function addText(x, y, text) {
            if (!text.trim()) {
                closeTextInput();
                return;
            }

            const fontSize = Math.max(14, currentSize * 4);
            const textElement = {
                id: elementIdCounter++,
                type: 'text',
                text: text,
                x: x,
                y: y,
                color: currentColor,
                opacity: currentOpacity,
                fontSize: fontSize,
                width: 0,
                height: 0
            };

            // Measure text dimensions
            ctx.save();
            ctx.font = `${fontSize}px 'Segoe UI', sans-serif`;
            const metrics = ctx.measureText(text);
            textElement.width = metrics.width;
            textElement.height = fontSize * 1.2;
            ctx.restore();

            elements.push(textElement);
            saveState();
            closeTextInput();
            redrawCanvas();
            showToast('Texto adicionado!', 'success');
        }

        function closeTextInput() {
            if (textInputOverlay) {
                textInputOverlay.remove();
                textInputOverlay = null;
            }
        }

        // ============ TEXT EDIT OVERLAY ============
        function showTextEditOverlay(textEl) {
            closeTextEditOverlay();

            textEditOverlay = document.createElement('div');
            textEditOverlay.className = 'text-input-overlay';
            textEditOverlay.style.left = (textEl.x + 10) + 'px';
            textEditOverlay.style.top = (textEl.y + textEl.height + 20) + 'px';
            textEditOverlay.style.minWidth = '250px';

            textEditOverlay.innerHTML = `
                <input type="text" id="textEditField" value="${escapeHtml(textEl.text)}" spellcheck="false">
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <label style="display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #aaa;">
                        <input type="color" id="textEditColor" value="${textEl.color}" style="width: 24px; height: 24px; border: none; border-radius: 4px; cursor: pointer;">
                        Cor
                    </label>
                    <label style="display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #aaa;">
                        Tamanho: <input type="number" id="textEditSize" value="${textEl.fontSize}" min="10" max="200" style="width: 60px; padding: 4px; background: #0d0d1a; border: 1px solid #0f3460; border-radius: 4px; color: #eee;">
                    </label>
                </div>
                <div class="text-input-actions">
                    <button class="confirm" id="confirmTextEdit">Salvar</button>
                    <button class="cancel" id="cancelTextEdit">Cancelar</button>
                    <button class="cancel" id="deleteTextEdit" style="background: #ef4444;">Excluir</button>
                </div>
            `;

            document.querySelector('.canvas-container').appendChild(textEditOverlay);

            const input = document.getElementById('textEditField');
            input.focus();
            input.select();

            document.getElementById('confirmTextEdit').addEventListener('click', () => applyTextEdit(textEl, input.value));
            document.getElementById('cancelTextEdit').addEventListener('click', closeTextEditOverlay);
            document.getElementById('deleteTextEdit').addEventListener('click', () => deleteTextElement(textEl));
            
            document.getElementById('textEditColor').addEventListener('change', (e) => {
                textEl.color = e.target.value;
                redrawCanvas();
            });
            
            document.getElementById('textEditSize').addEventListener('change', (e) => {
                textEl.fontSize = parseInt(e.target.value);
                // Recalculate width/height
                ctx.save();
                ctx.font = `${textEl.fontSize}px 'Segoe UI', sans-serif`;
                const metrics = ctx.measureText(textEl.text);
                textEl.width = metrics.width;
                textEl.height = textEl.fontSize * 1.2;
                ctx.restore();
                redrawCanvas();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    applyTextEdit(textEl, input.value);
                } else if (e.key === 'Escape') {
                    closeTextEditOverlay();
                }
            });
        }

        function applyTextEdit(textEl, newText) {
            if (!newText.trim()) {
                deleteTextElement(textEl);
                return;
            }

            textEl.text = newText;
            
            // Recalculate width/height
            ctx.save();
            ctx.font = `${textEl.fontSize}px 'Segoe UI', sans-serif`;
            const metrics = ctx.measureText(textEl.text);
            textEl.width = metrics.width;
            textEl.height = textEl.fontSize * 1.2;
            ctx.restore();

            saveState();
            closeTextEditOverlay();
            redrawCanvas();
            showToast('Texto atualizado!', 'success');
        }

        function deleteTextElement(textEl) {
            elements = elements.filter(el => el.id !== textEl.id);
            selectedElement = null;
            saveState();
            closeTextEditOverlay();
            redrawCanvas();
            showToast('Texto excluído', 'info');
        }

        function closeTextEditOverlay() {
            if (textEditOverlay) {
                textEditOverlay.remove();
                textEditOverlay = null;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============ AÇÕES ============
        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === tool);
            });

            const toolNames = { pen: 'Caneta', eraser: 'Borracha', text: 'Texto', select: 'Selecionar' };
            showToast(`Ferramenta: ${toolNames[tool]}`, 'info');
        }

        function selectColor(color) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.color === color);
            });
        }

        function clearCanvas() {
            if (confirm('Tem certeza que deseja limpar todo o quadro?')) {
                elements = [];
                selectedElement = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(10, 10, 26, 0.95)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveState();
                showToast('Quadro limpo!', 'success');
            }
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreState(history[historyIndex]);
                showToast('Desfeito!', 'info');
            } else {
                showToast('Nada para desfazer', 'error');
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreState(history[historyIndex]);
                showToast('Refeito!', 'info');
            } else {
                showToast('Nada para refazer', 'error');
            }
        }

        // ============ ELEMENT MANAGEMENT ============
        function saveState() {
            history = history.slice(0, historyIndex + 1);
            history.push(JSON.stringify(elements));
            historyIndex = history.length - 1;

            // Limitar histórico a 50 estados
            if (history.length > 50) {
                history.shift();
                historyIndex--;
            }

            // Persistir quadro no localStorage
            saveWhiteboardState();
        }

        function saveWhiteboardState() {
            try {
                const state = {
                    elements: elements,
                    savedAt: new Date().toISOString()
                };
                localStorage.setItem('lousa-whiteboard', JSON.stringify(state));
            } catch (e) {
                console.warn('Não foi possível salvar quadro:', e);
            }
        }

        function loadWhiteboardState() {
            try {
                const saved = localStorage.getItem('lousa-whiteboard');
                if (saved) {
                    const state = JSON.parse(saved);
                    if (state.elements && Array.isArray(state.elements)) {
                        elements = state.elements;
                        // Calcular dimensões dos textos para hit testing
                        elements.forEach(el => {
                            if (el.type === 'text') {
                                ctx.save();
                                ctx.font = `${el.fontSize}px 'Segoe UI', sans-serif`;
                                const metrics = ctx.measureText(el.text);
                                el.width = metrics.width;
                                el.height = el.fontSize * 1.2;
                                ctx.restore();
                            }
                        });
                        redrawCanvas();
                        showToast('Quadro anterior restaurado', 'info');
                    }
                }
            } catch (e) {
                console.warn('Não foi possível carregar quadro:', e);
            }
        }

        function restoreState(elementsJson) {
            elements = JSON.parse(elementsJson);
            redrawCanvas();
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Fundo semi-transparente para permitir ver as estrelas do container
            ctx.fillStyle = 'rgba(10, 10, 26, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // First pass: draw all regular strokes, text, and images
            elements.forEach(el => {
                if (el.type === 'stroke' && !el.isEraser) {
                    drawStroke(el);
                } else if (el.type === 'text') {
                    drawTextElement(el);
                } else if (el.type === 'image') {
                    drawImageElement(el);
                }
            });

            // Second pass: apply eraser strokes with destination-out
            elements.forEach(el => {
                if (el.type === 'stroke' && el.isEraser) {
                    drawEraserStroke(el);
                }
            });

            // Draw selection highlight if element is selected
            if (selectedElement) {
                drawSelectionHighlight(selectedElement);
            }
        }

        function drawStroke(stroke) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = hexToRgba(stroke.color, stroke.opacity);
            ctx.lineWidth = stroke.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            if (stroke.points.length > 0) {
                ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                ctx.stroke();
            }
        }

        function drawEraserStroke(stroke) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = stroke.size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            if (stroke.points.length > 0) {
                ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                ctx.stroke();
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawTextElement(textEl) {
            ctx.save();
            ctx.font = `${textEl.fontSize}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = hexToRgba(textEl.color, textEl.opacity);
            ctx.textBaseline = 'top';
            ctx.fillText(textEl.text, textEl.x, textEl.y);
            
            // Store measured width/height for selection
            const metrics = ctx.measureText(textEl.text);
            textEl.width = metrics.width;
            textEl.height = textEl.fontSize * 1.2;
            ctx.restore();
        }

        function drawImageElement(imageEl) {
            const img = new Image();
            img.onload = () => {
                ctx.globalAlpha = imageEl.opacity || 1;
                ctx.drawImage(img, imageEl.x, imageEl.y, imageEl.width, imageEl.height);
                ctx.globalAlpha = 1;
            };
            img.src = imageEl.dataUrl;
        }

        function drawSelectionHighlight(el) {
            if (el.type === 'text' || el.type === 'image') {
                ctx.save();
                ctx.strokeStyle = '#00d9ff';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(el.x - 4, el.y - 4, el.width + 8, el.height + 8);
                ctx.setLineDash([]);
                
                // Draw resize handles
                const handles = getResizeHandles(el);
                handles.forEach(handle => {
                    ctx.fillStyle = '#00d9ff';
                    ctx.fillRect(handle.x - 4, handle.y - 4, 8, 8);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(handle.x - 4, handle.y - 4, 8, 8);
                });
                ctx.restore();
            } else if (el.type === 'stroke') {
                // For strokes, draw bounding box
                const bounds = getStrokeBounds(el);
                ctx.save();
                ctx.strokeStyle = '#00d9ff';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(bounds.minX - 4, bounds.minY - 4, bounds.maxX - bounds.minX + 8, bounds.maxY - bounds.minY + 8);
                ctx.setLineDash([]);
                ctx.restore();
            }
        }

        function getStrokeBounds(stroke) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            stroke.points.forEach(p => {
                minX = Math.min(minX, p.x);
                minY = Math.min(minY, p.y);
                maxX = Math.max(maxX, p.x);
                maxY = Math.max(maxY, p.y);
            });
            return { minX, minY, maxX, maxY };
        }

        function getResizeHandles(el) {
            if (el.type === 'text' || el.type === 'image') {
                return [
                    { x: el.x - 4, y: el.y - 4, type: 'nw' },
                    { x: el.x + el.width + 4, y: el.y - 4, type: 'ne' },
                    { x: el.x - 4, y: el.y + el.height + 4, type: 'sw' },
                    { x: el.x + el.width + 4, y: el.y + el.height + 4, type: 'se' }
                ];
            }
            return [];
        }

        function getHandleAtPosition(el, x, y) {
            const handles = getResizeHandles(el);
            for (const handle of handles) {
                if (x >= handle.x - 8 && x <= handle.x + 8 && y >= handle.y - 8 && y <= handle.y + 8) {
                    return handle.type;
                }
            }
            return null;
        }

        function isPointInElement(el, x, y) {
            if (el.type === 'text') {
                return x >= el.x - 4 && x <= el.x + el.width + 4 && y >= el.y - 4 && y <= el.y + el.height + 4;
            } else if (el.type === 'stroke') {
                const bounds = getStrokeBounds(el);
                return x >= bounds.minX - 4 && x <= bounds.maxX + 4 && y >= bounds.minY - 4 && y <= bounds.maxY + 4;
            } else if (el.type === 'image') {
                return x >= el.x - 4 && x <= el.x + el.width + 4 && y >= el.y - 4 && y <= el.y + el.height + 4;
            }
            return false;
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = `lousa-digital-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('Imagem salva!', 'success');
        }

        function toggleCamera() {
            if (cameraActive) {
                stopCamera();
            } else {
                initCamera();
            }
        }

        function stopCamera() {
            if (camera) {
                camera.stop();
                camera = null;
            }
            cameraActive = false;
            video.classList.add('hidden');
            handIndicator.style.display = 'none';
            updateCameraStatus('inactive', 'Câmera: Parada');
            updateHandStatus('none', 'Mão: Não detectada');

            showToast('Câmera parada', 'info');
        }

        // ============ UI HELPERS ============
        function updateCameraStatus(state, text) {
            const dot = document.getElementById('cameraStatus');
            const label = document.getElementById('cameraStatusText');
            dot.className = 'status-dot';
            if (state === 'active') dot.classList.add('active');

                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="12" r="4"/></svg> Parar Câmera`;
                btn.className = 'action-btn danger';

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
