services:
  # Backend - FastAPI (Web Service)
  - type: web
    name: ifg-jatai-estudos-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: DB_NAME
        value: study_app
      - key: EMAIL_VERIFICATION_MODE
        value: mock
      - key: FRONTEND_URL
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # Frontend - React (CRA)
  - type: static
    name: ifg-jatai-estudos-web
    rootDir: frontend
    buildCommand: yarn install && yarn build
    publishPath: build
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
